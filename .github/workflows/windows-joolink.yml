name: Build HomeJoolink Windows x64
on:
  push:
    branches: [joolink-windows-v1]
    paths:
      - 'windows-joolink/**'
      - '.github/workflows/windows-joolink.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    name: Build Windows desktop package
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build x64 app with bundled .NET and VLC
        shell: pwsh
        run: dotnet publish windows-joolink/HomeJoolink.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false --output windows-joolink/publish
      - name: Zip the full app folder
        shell: pwsh
        run: |
          if (-not (Test-Path 'windows-joolink/publish/HomeJoolink.exe')) { throw 'HomeJoolink.exe missing' }
          Compress-Archive -Path 'windows-joolink/publish/*' -DestinationPath 'HomeJoolink-Windows-x64.zip' -Force
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeJoolink-Windows-x64
          path: HomeJoolink-Windows-x64.zip
          retention-days: 30
      - name: Publish Windows test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view 'joolink-windows-v1.0.0' 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create 'joolink-windows-v1.0.0' 'HomeJoolink-Windows-x64.zip' --target '${{ github.sha }}' --title 'HomeJoolink Windows v1.0.0 (TEST)' --notes 'Windows 10/11 x64 test: Joolink cloud login and camera list plus RTSP/HTTP LibVLC media player with software/hardware decoder options. Vendor cloud live video is NOT yet implemented. Download ZIP, extract all files, run HomeJoolink.exe.'
          } else {
            gh release upload 'joolink-windows-v1.0.0' 'HomeJoolink-Windows-x64.zip' --clobber
          }