name: Build HomeJoolink Windows fast-start installer
on:
  push:
    branches: [joolink-windows-v1]
    paths:
      - 'windows-joolink/**'
      - '.github/workflows/windows-joolink.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    name: Build and verify Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish app with native VLC components as installed files
        shell: pwsh
        run: |
          dotnet publish windows-joolink/HomeJoolink.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:PublishTrimmed=false --output windows-joolink/publish-installed
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
          if (!(Test-Path windows-joolink/publish-installed/HomeJoolink.exe)) { throw "App EXE not found" }
          $native = @(Get-ChildItem windows-joolink/publish-installed -Recurse -Filter 'libvlc.dll' -ErrorAction SilentlyContinue)
          if ($native.Count -lt 1) { throw "VLC native files not included in published app" }
      - name: Windows app startup and VLC test before packaging
        shell: pwsh
        run: |
          $app = (Resolve-Path windows-joolink/publish-installed/HomeJoolink.exe).Path
          foreach ($mode in @('--self-test','--ui-self-test','--cloud-schema-self-test')) {
            $report = Join-Path $env:RUNNER_TEMP (($mode -replace '^--','') + '-before-install.txt')
            $p = Start-Process -FilePath $app -ArgumentList @($mode, $report) -PassThru
            if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw "$mode timed out" }
            if (!(Test-Path $report)) { throw "$mode did not write test report" }
            $result = Get-Content $report -Raw
            Write-Host $result
            if ($p.ExitCode -ne 0 -or !$result.StartsWith('OK')) { throw "$mode failed" }
          }
      - name: Install Inno Setup compiler if not present
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler missing" }
      - name: Build standalone installer EXE
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'windows-joolink/installer/HomeJoolink.iss'
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          if (!(Test-Path 'windows-joolink/installer/dist/HomeJoolink-Windows-v1.0.9-Setup.exe')) { throw "Installer EXE missing" }
      - name: Silent install and launch from installed directory
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'windows-joolink/installer/dist/HomeJoolink-Windows-v1.0.9-Setup.exe').Path
          $target = Join-Path $env:RUNNER_TEMP 'HomeJoolink-installed'
          $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/DIR="' + $target + '"'))
          $process = Start-Process -FilePath $installer -ArgumentList $installArgs -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Silent installation failed with exit code $($process.ExitCode)" }
          $app = Join-Path $target 'HomeJoolink.exe'
          if (!(Test-Path $app)) { throw "Installed exe missing" }
          foreach ($mode in @('--self-test','--ui-self-test','--cloud-schema-self-test')) {
            $report = Join-Path $env:RUNNER_TEMP (($mode -replace '^--','') + '-after-install.txt')
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process -FilePath $app -ArgumentList @($mode, $report) -PassThru
            if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force; throw "Installed $mode timed out" }
            $watch.Stop()
            if (!(Test-Path $report)) { throw "Installed $mode did not write test report" }
            $result = Get-Content $report -Raw
            Write-Host "$mode / $([math]::Round($watch.Elapsed.TotalSeconds,2))s / $result"
            if ($p.ExitCode -ne 0 -or !$result.StartsWith('OK')) { throw "Installed $mode failed" }
          }
      - name: Publish installer EXE as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeJoolink-Windows-v1.0.9-Setup
          path: windows-joolink/installer/dist/HomeJoolink-Windows-v1.0.9-Setup.exe
          retention-days: 30
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $file = 'windows-joolink/installer/dist/HomeJoolink-Windows-v1.0.9-Setup.exe'
          gh release view 'joolink-windows-v1.0.9' 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create 'joolink-windows-v1.0.9' $file --target '${{ github.sha }}' --title 'HomeJoolink Windows v1.0.9 (fast-start installer EXE)' --notes 'Single setup EXE. Installs the app, .NET 8 and LibVLC locally once, with Start menu shortcut, so later launches do not extract the 216 MB portable bundle. Tested installed GUI and VLC startup on Windows CI. New persistent account login-success indicator and separate camera-list errors; Windows UI test checks that success remains visible after E_000_002. Vendor cloud video P2P not yet implemented. Cloud device-list E_000_002 still needs a real-account test; manufacturer cloud live-video/P2P not yet supported. Unsigned test installer.'
          } else {
            gh release upload 'joolink-windows-v1.0.9' $file --clobber
          }
