name: Build HomeJoolink Windows x64 EXE
on:
  push:
    branches: [joolink-windows-v1]
    paths:
      - 'windows-joolink/**'
      - '.github/workflows/windows-joolink.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    name: Build and test one Windows EXE
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows EXE
        shell: pwsh
        run: |
          dotnet publish windows-joolink/HomeJoolink.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o windows-joolink/publish-single
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
      - name: Confirm there are no companion files
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'windows-joolink/publish-single/HomeJoolink.exe').Path
          $other = @(Get-ChildItem 'windows-joolink/publish-single' -File -Recurse | Where-Object { $_.FullName -ne $exe })
          if ($other.Count -gt 0) { throw ("Not a single-file build: " + ($other.Name -join ', ')) }
          $mb = [Math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "Single EXE $mb MB"
      - name: Smoke-test embedded VLC with Windows executable
        shell: pwsh
        run: |
          $result = Join-Path $env:RUNNER_TEMP 'homejoolink-vlc-selftest.txt'
          $app = (Resolve-Path 'windows-joolink/publish-single/HomeJoolink.exe').Path
          $process = Start-Process -FilePath $app -ArgumentList @('--self-test', $result) -Wait -PassThru
          if (!(Test-Path $result)) { throw "Self-test did not produce result; exit $($process.ExitCode)" }
          $report = Get-Content -LiteralPath $result -Raw
          Write-Host $report
          if ($process.ExitCode -ne 0 -or !$report.StartsWith('OK')) { throw "VLC self-test failed" }
      - name: Prepare standalone EXE
        shell: pwsh
        run: Copy-Item 'windows-joolink/publish-single/HomeJoolink.exe' 'HomeJoolink-Windows-v1.0.2.exe'
      - name: Upload EXE as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeJoolink-Windows-v1.0.2-EXE
          path: HomeJoolink-Windows-v1.0.2.exe
          retention-days: 30
      - name: Publish public GitHub EXE release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view 'joolink-windows-v1.0.2' 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create 'joolink-windows-v1.0.2' 'HomeJoolink-Windows-v1.0.2.exe' --target '${{ github.sha }}' --title 'HomeJoolink Windows v1.0.2 (single EXE TEST)' --notes 'Windows x64 standalone EXE. Screen/DPI layout fix, selectable camera request mode and safe E_000_002 diagnostics. No ZIP required. Bundled .NET 8 + LibVLC. App includes experimental Joolink cloud login/camera list and RTSP/HTTP media player. Manufacturer cloud live-video/P2P protocol is NOT implemented. Unsigned test application.'
          } else {
            gh release upload 'joolink-windows-v1.0.2' 'HomeJoolink-Windows-v1.0.2.exe' --clobber
          }
