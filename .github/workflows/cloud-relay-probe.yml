name: Build HomeJoolink Android APK
on:
  push:
    branches:
      - joolink-cloud-relay-probe
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Rename Android APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/HomeJoolink.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeJoolink-APK
          path: app/build/outputs/apk/debug/HomeJoolink.apk
          if-no-files-found: error
      - name: Publish HomeJoolink APK as GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="homejoolink-v1.6.1"
          APK="app/build/outputs/apk/debug/HomeJoolink.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "HomeJoolink 1.6.1 — serverivideo katse" \
              --notes "HomeJoolink eksperimentaalne Androidi testäpp. Joolinki pilvekonto sisselogimine, kaamerate loend ning KP2P/TURN ühenduse test. Pilvevideo näitamine ei ole veel valmis. ARM64, Android 8+." \
              --prerelease --target "$GITHUB_SHA"
          fi
