name: Build HomeJoolink 2.0
on:
  push:
    branches: [homejoolink-lite-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APKs
        run: gradle --no-daemon --stacktrace assembleLiteDebug assembleCompatDebug
      - name: Verify outputs
        run: |
          python3 - <<'PY'
          import os,zipfile
          for flavor in ("lite","compat"):
              path=f"app/build/outputs/apk/{flavor}/debug/app-{flavor}-debug.apk"
              with zipfile.ZipFile(path) as z:
                  abis=sorted({v.split("/")[1] for v in z.namelist() if v.startswith("lib/") and v.endswith(".so")})
                  print(flavor,round(os.path.getsize(path)/1024/1024,2),"MiB",abis)
                  if flavor=="compat": assert abis==["arm64-v8a"]
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HomeJoolink-2.0-APK
          path: |
            app/build/outputs/apk/lite/debug/app-lite-debug.apk
            app/build/outputs/apk/compat/debug/app-compat-debug.apk
          if-no-files-found: error
      - name: Publish APK download links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="homejoolink-lite-v2.0.0"
          LITE="app/build/outputs/apk/lite/debug/app-lite-debug.apk"
          VLC="app/build/outputs/apk/compat/debug/app-compat-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$LITE#HomeJoolink-Lite-v2.apk" "$VLC#HomeJoolink-VLC-v2.apk" --clobber
          else
            gh release create "$TAG" "$LITE#HomeJoolink-Lite-v2.apk" "$VLC#HomeJoolink-VLC-v2.apk" --target "$GITHUB_SHA" --title "HomeJoolink 2.0 – Lite + VLC" --notes "Lite Media3 RTSP TCP is experimental. VLC flavor keeps tested Joolink Viewer 1.1.0 video engine. LAN RTSP relay experimental, proprietary cloud P2P not implemented." --latest=false
          fi
